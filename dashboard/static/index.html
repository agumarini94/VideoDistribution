<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribution Engine — Dashboard</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e6e8eb;
    --text-dim: #9aa2b1;
    --accent: #5b8def;

    --published: #3ecf8e;
    --failed: #f2545b;
    --scheduled: #e8a33d;
    --neutral: #8891a5;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-border: #e2e5ea;
      --text: #1a1d24;
      --text-dim: #5c6270;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 32px 48px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }

  #last-updated {
    color: var(--text-dim);
    font-size: 13px;
  }

  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .card .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .card .value {
    font-size: 26px;
    font-weight: 700;
  }

  .card.published .value { color: var(--published); }
  .card.failed .value { color: var(--failed); }
  .card.scheduled .value { color: var(--scheduled); }
  .card.queued .value,
  .card.processing .value { color: var(--neutral); }

  .filters {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 760px;
  }

  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--panel-border);
    white-space: nowrap;
  }

  th {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  tr:last-child td { border-bottom: none; }

  td.error-cell {
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: help;
  }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: capitalize;
  }

  .badge.published { background: rgba(62, 207, 142, 0.15); color: var(--published); }
  .badge.failed { background: rgba(242, 84, 91, 0.15); color: var(--failed); }
  .badge.scheduled { background: rgba(232, 163, 61, 0.15); color: var(--scheduled); }
  .badge.queued, .badge.processing { background: rgba(136, 145, 165, 0.15); color: var(--neutral); }

  button.retry {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  button.retry:hover { opacity: 0.85; }
  button.retry:disabled { opacity: 0.5; cursor: default; }

  .empty {
    padding: 24px;
    text-align: center;
    color: var(--text-dim);
  }

  .readonly-note {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Distribution Engine — Dashboard</h1>
  <div id="last-updated">Loading…</div>
</header>

<div class="stat-cards" id="stat-cards"></div>

<div class="filters">
  <select id="filter-status">
    <option value="">All statuses</option>
  </select>
  <select id="filter-platform">
    <option value="">All platforms</option>
  </select>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Platform</th>
        <th>Status</th>
        <th>Attempts</th>
        <th>Scheduled at</th>
        <th>Error</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="jobs-body"></tbody>
  </table>
  <div class="empty" id="empty-msg" style="display:none;">No jobs match the current filters.</div>
</div>

<p class="readonly-note">Read-only, except the Retry action on failed jobs. Auto-refreshes every 5s.</p>

<script>
const STATUSES = ["scheduled", "queued", "processing", "published", "failed"];
const REFRESH_MS = 5000;

const statusFilter = document.getElementById("filter-status");
const platformFilter = document.getElementById("filter-platform");
const jobsBody = document.getElementById("jobs-body");
const emptyMsg = document.getElementById("empty-msg");
const lastUpdated = document.getElementById("last-updated");
const statCards = document.getElementById("stat-cards");

STATUSES.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s;
  opt.textContent = s;
  statusFilter.appendChild(opt);
});

let knownPlatforms = new Set();

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail || detail;
    } catch (_) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

function renderStats(stats) {
  statCards.innerHTML = "";
  const order = ["scheduled", "queued", "processing", "published", "failed"];
  order.forEach(status => {
    const card = document.createElement("div");
    card.className = `card ${status}`;
    card.innerHTML = `
      <div class="label">${status}</div>
      <div class="value">${stats.by_status[status] ?? 0}</div>
    `;
    statCards.appendChild(card);
  });
  const total = document.createElement("div");
  total.className = "card";
  total.innerHTML = `<div class="label">Total</div><div class="value">${stats.total}</div>`;
  statCards.appendChild(total);
}

function renderPlatformOptions(jobs) {
  const platforms = new Set(jobs.map(j => j.platform));
  let changed = false;
  platforms.forEach(p => {
    if (!knownPlatforms.has(p)) changed = true;
  });
  if (!changed) return;
  knownPlatforms = new Set([...knownPlatforms, ...platforms]);

  const current = platformFilter.value;
  platformFilter.innerHTML = '<option value="">All platforms</option>';
  [...knownPlatforms].sort().forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    platformFilter.appendChild(opt);
  });
  platformFilter.value = current;
}

function renderJobs(jobs) {
  jobsBody.innerHTML = "";
  emptyMsg.style.display = jobs.length === 0 ? "block" : "none";

  jobs.forEach(job => {
    const tr = document.createElement("tr");

    const errorText = job.error_message || "";
    const truncated = errorText.length > 60 ? errorText.slice(0, 60) + "…" : errorText || "—";

    tr.innerHTML = `
      <td>${job.id}</td>
      <td>${escapeHtml(job.platform)}</td>
      <td><span class="badge ${job.status}">${job.status}</span></td>
      <td>${job.attempts}</td>
      <td>${fmtDate(job.scheduled_at)}</td>
      <td class="error-cell" title="${escapeHtml(errorText)}">${escapeHtml(truncated)}</td>
      <td></td>
    `;

    if (job.status === "failed") {
      const btn = document.createElement("button");
      btn.className = "retry";
      btn.textContent = "Retry";
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = "Retrying…";
        try {
          await fetchJson(`/api/jobs/${job.id}/retry`, { method: "POST" });
          await refresh();
        } catch (e) {
          alert(`Retry failed: ${e.message}`);
          btn.disabled = false;
          btn.textContent = "Retry";
        }
      };
      tr.lastElementChild.appendChild(btn);
    }

    jobsBody.appendChild(tr);
  });
}

async function refresh() {
  try {
    const [stats, jobs] = await Promise.all([
      fetchJson("/api/stats"),
      fetchJson(
        "/api/jobs?" +
          new URLSearchParams({
            ...(statusFilter.value ? { status: statusFilter.value } : {}),
            ...(platformFilter.value ? { platform: platformFilter.value } : {}),
            limit: 50,
          })
      ),
    ]);
    renderStats(stats);
    renderPlatformOptions(jobs);
    renderJobs(jobs);
    lastUpdated.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    lastUpdated.textContent = `Update failed: ${e.message}`;
  }
}

statusFilter.addEventListener("change", refresh);
platformFilter.addEventListener("change", refresh);

refresh();
setInterval(refresh, REFRESH_MS);
</script>

</body>
</html>
