<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postline — Distribution Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap');

  :root {
    --bg: #f2f2f3;
    --surface: #e9e9ea;
    --ink: #1d1f20;
    --accent: #5980a6;
    --accent-hover: #597ea3;
    --accent-dark: #416180;
    --accent-deep: #2c455d;
    --border: rgba(29, 31, 32, 0.16);
    --border-soft: rgba(29, 31, 32, 0.08);
    --muted: rgba(29, 31, 32, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
  }

  h1, h2, h3, .heading {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    margin: 0;
  }

  button { font-family: inherit; }

  .app { display: flex; min-height: 100vh; }

  /* ---------------- Sidebar ---------------- */
  .sidebar {
    width: 216px;
    flex: none;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 24px;
  }

  .brand { display: flex; align-items: center; gap: 9px; padding: 0 6px; }
  .brand-mark {
    width: 26px; height: 26px; border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center; flex: none; color: var(--accent);
  }
  .brand-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; cursor: pointer;
    font-size: 14px; border: none; background: none; color: var(--ink); text-align: left; width: 100%;
  }
  .nav-item svg { width: 16px; height: 16px; flex: none; }
  .nav-item.active { background: var(--accent); color: var(--bg); }
  .nav-item:hover:not(.active) { background: var(--border-soft); }

  .sidebar-footer {
    margin-top: auto; padding: 10px 6px 0; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }

  /* ---------------- Topbar ---------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex; align-items: center; gap: 14px; padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }

  .client-switch { position: relative; }
  .client-switch-btn {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    padding: 7px 12px; cursor: pointer; min-width: 190px; background: var(--bg); color: var(--ink);
  }
  .client-initial {
    width: 20px; height: 20px; border: 1px solid var(--accent-dark); display: flex; align-items: center;
    justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 11px;
    color: var(--accent-dark); flex: none;
  }
  .client-switch-btn .name { flex: 1; font-size: 14px; text-align: left; }
  .client-switch-btn svg { width: 14px; height: 14px; color: var(--muted); }

  .client-menu {
    position: absolute; top: calc(100% + 4px); left: 0; width: 240px; background: var(--bg);
    border: 1px solid var(--border); box-shadow: 0 3px 10px rgba(43,43,45,0.16); z-index: 20;
  }
  .client-menu-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; font-size: 13px; border: none;
    background: none; width: 100%; text-align: left; color: var(--ink);
  }
  .client-menu-item:hover { background: var(--border-soft); }
  .client-menu-item .kind { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .client-menu-add {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; font-size: 13px;
    color: var(--accent-dark); border-top: 1px solid var(--border); background: none; border-left: none;
    border-right: none; border-bottom: none; width: 100%; text-align: left;
  }
  .client-menu-add:hover { background: var(--border-soft); }
  .client-menu-add svg { width: 14px; height: 14px; }

  .screen-title { flex: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--bg);
    border: 1px solid var(--accent); padding: 8px 16px; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-primary svg { width: 14px; height: 14px; }

  .btn-secondary {
    display: inline-flex; align-items: center; gap: 6px; background: var(--bg); color: var(--ink);
    border: 1px solid var(--border); padding: 7px 14px; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn-secondary:hover { background: var(--border-soft); }
  .btn-secondary svg { width: 13px; height: 13px; }

  .content { padding: 24px; flex: 1; overflow: auto; }

  /* ---------------- Calendar ---------------- */
  .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .calendar-context { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .month-nav-btn {
    border: 1px solid var(--border); background: var(--bg); width: 26px; height: 26px; display: flex;
    align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
  }
  .month-nav-btn:hover { background: var(--border-soft); }
  .month-nav-btn svg { width: 13px; height: 13px; }

  .seg-control { display: inline-flex; border: 1px solid var(--border); }
  .seg-btn { padding: 6px 14px; font-size: 13px; cursor: pointer; border: none; background: var(--bg); color: var(--ink); }
  .seg-btn.active { background: var(--accent); color: var(--bg); }

  .month-grid-wrap { position: relative; border: 1px solid var(--border); }
  .reg-mark { position: absolute; width: 11px; height: 11px; color: var(--muted); }
  .reg-mark::before, .reg-mark::after { content: ""; position: absolute; background: currentColor; }
  .reg-mark::before { left: 5px; top: 0; width: 1px; height: 100%; }
  .reg-mark::after { top: 5px; left: 0; width: 100%; height: 1px; }
  .reg-tl { top: -6px; left: -6px; } .reg-tr { top: -6px; right: -6px; }
  .reg-bl { bottom: -6px; left: -6px; } .reg-br { bottom: -6px; right: -6px; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .weekday-cell {
    padding: 8px 10px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); border-bottom: 1px solid var(--border);
  }
  .day-cell {
    min-height: 96px; padding: 6px; border-right: 1px solid var(--border-soft);
    border-bottom: 1px solid var(--border-soft);
  }
  .day-cell.faded { opacity: 0.35; }
  .day-num { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .day-jobs { display: flex; flex-direction: column; gap: 3px; }
  .job-chip {
    display: flex; align-items: center; gap: 5px; font-size: 10.5px; padding: 2px 5px; cursor: default;
    overflow: hidden;
  }
  .job-chip .letter { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; flex: none; }
  .job-chip .caption { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day-overflow { font-size: 10px; color: var(--muted); }

  .agenda-group { margin-bottom: 18px; }
  .agenda-group-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .agenda-row {
    display: flex; align-items: center; gap: 14px; padding: 11px 4px; border-bottom: 1px solid var(--border-soft);
  }
  .agenda-time { width: 52px; font-size: 12px; color: var(--muted); flex: none; }
  .platform-box {
    width: 22px; height: 22px; border: 1px solid rgba(29,31,32,0.25); display: flex; align-items: center;
    justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 11px;
    color: var(--accent-dark); flex: none;
  }
  .agenda-caption { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agenda-client { font-size: 11px; color: var(--muted); flex: none; }
  .status-pill { font-size: 11px; padding: 3px 9px; flex: none; }

  /* ---------------- Queue ---------------- */
  .filter-chips { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 13px; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border); background: var(--bg);
    color: var(--ink);
  }
  .filter-chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.data-table th {
    text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    padding: 8px; border-bottom: 1px solid var(--border);
  }
  table.data-table td { padding: 9px 8px; border-bottom: 1px solid var(--border-soft); }
  table.data-table td.truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.data-table td.muted { color: var(--muted); }
  .retry-link {
    display: inline-flex; align-items: center; gap: 5px; color: var(--accent-dark); cursor: pointer;
    font-size: 12.5px; border: none; background: none; padding: 0;
  }
  .retry-link:hover { color: var(--accent-deep); }
  .retry-link svg { width: 13px; height: 13px; }
  .retry-link:disabled { opacity: 0.5; cursor: default; }

  .empty-state { padding: 40px 0; text-align: center; color: var(--muted); font-size: 13.5px; }
  .error-state { padding: 16px; border: 1px solid var(--border); background: #f5e7e7; color: #7a3030; font-size: 13.5px; }

  /* ---------------- Placeholder screens ---------------- */
  .placeholder { border: 1px solid var(--border); padding: 40px 24px; text-align: center; color: var(--muted); }
  .placeholder .heading { font-size: 18px; margin-bottom: 8px; color: var(--ink); }
  .placeholder p { font-size: 13.5px; margin: 0; }

  /* ---------------- Analytics ---------------- */
  .stat-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat-card { position: relative; border: 1px solid var(--border); padding: 16px; }
  .stat-card .stat-label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-dark); margin-bottom: 6px;
  }
  .stat-card .stat-value { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 1; }
  .analytics-section { margin-bottom: 28px; }
  .analytics-section-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .bar-chart {
    display: flex; align-items: flex-end; gap: 4px; height: 140px;
    border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; min-width: 0; }
  .bar-fill { width: 100%; background: var(--accent); min-height: 1px; }
  .bar-fill.empty { background: var(--border); }
  .bar-axis { display: flex; gap: 4px; margin-top: 6px; }
  .bar-axis > div { flex: 1; text-align: center; font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Basic accounts list */
  .accounts-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--border); }
  .account-row { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-bottom: 1px solid var(--border-soft); }
  .account-row:last-child { border-bottom: none; }
  .account-name { font-size: 13.5px; }
  .account-sub { font-size: 11px; color: var(--muted); }

  /* ---------------- Composer ---------------- */
  .composer-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .composer-col-left { display: flex; flex-direction: column; gap: 16px; }
  .composer-col-right { display: flex; flex-direction: column; gap: 14px; }

  .form-group { display: flex; flex-direction: column; }
  .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-input {
    width: 100%; min-height: 36px; padding: 6px 10px; font-family: 'Barlow', sans-serif;
    font-size: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--ink);
  }
  select.form-input { min-height: 36px; }
  .composer-textarea { min-height: 110px; padding: 10px; resize: vertical; }
  .composer-platform-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .dropzone {
    border: 1px solid var(--border); padding: 22px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; color: var(--muted);
  }
  .dropzone input[type="file"] { font-size: 12.5px; max-width: 100%; }
  .form-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .form-hint-warn { color: #7a3030; }
  .composer-row { display: flex; gap: 12px; align-items: flex-end; }
  .composer-row > div { flex: 1; }
  .form-checkbox-row { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; font-size: 13.5px; }
  .composer-actions { display: flex; gap: 10px; margin-top: 4px; }
  .composer-actions .btn-secondary, .composer-actions .btn-primary { flex: 1; justify-content: center; }
  .composer-actions .btn-primary:disabled { opacity: 0.6; cursor: default; }

  .preview-card { border: 1px solid var(--border); padding: 14px; }
  .preview-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .preview-platform-label { font-size: 13px; font-weight: 500; }
  .char-counter { margin-left: auto; font-size: 11px; color: var(--muted); }
  .char-counter.over { color: #7a3030; }
  .preview-media {
    height: 120px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-size: 11px; color: var(--muted); text-align: center; padding: 0 10px;
    background-color: var(--surface);
    background-image: repeating-linear-gradient(45deg, rgba(29,31,32,0.14) 0, rgba(29,31,32,0.14) 3px, transparent 3px, transparent 10px);
  }
  .preview-text { font-size: 13px; line-height: 1.4; }

  /* ---------------- Auth (login / register) ---------------- */
  .auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .auth-card { width: 380px; border: 1px solid var(--border); padding: 30px; background: var(--bg); }
  .auth-title { font-size: 21px; margin-bottom: 4px; }
  .auth-subtitle { font-size: 12.5px; color: var(--muted); margin-bottom: 20px; line-height: 1.4; }
  .auth-switch { margin-top: 16px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .auth-switch-link { color: var(--accent-dark); cursor: pointer; }
  .auth-switch-link:hover { color: var(--accent-deep); }
  .auth-success { padding: 12px; border: 1px solid var(--border); background: #eef6ff; color: #2c455d; font-size: 13px; margin-bottom: 14px; line-height: 1.4; }

  /* ---------------- Admin ---------------- */
  .admin-section { margin-bottom: 30px; }
  .admin-section-title { font-size: 16px; margin-bottom: 10px; }
  .admin-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>

<div class="app" id="app-root" style="display:none;">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <i data-lucide="send" style="width:14px;height:14px;"></i>
      </div>
      <div class="brand-name">Postline</div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="client-switch" id="client-switch"></div>
      <div class="screen-title" id="screen-title"></div>
      <button class="btn-primary" id="new-post-btn">
        <i data-lucide="plus"></i> New post
      </button>
    </div>

    <div class="content" id="content"></div>
  </div>

</div>

<div class="auth-shell" id="auth-root" style="display:none;"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
// ---------------------------------------------------------------------
// Postline scheduler UI (Phase 26) — Calendar and Queue are fully wired
// to the backend; every other nav item is a placeholder until its own
// phase (see CLAUDE.md Phase 26 "explicitly deferred" list). Vanilla JS,
// no build step, single re-render pass per state change — same
// no-framework convention as the dashboard this replaces.
// ---------------------------------------------------------------------

const BASE_NAV_ITEMS = [
  { id: "calendar", label: "Calendar", icon: "calendar" },
  { id: "queue", label: "Queue", icon: "list" },
  { id: "approvals", label: "Approvals", icon: "check-square" },
  { id: "analytics", label: "Analytics", icon: "bar-chart-2" },
  { id: "media", label: "Media library", icon: "image" },
  { id: "accounts", label: "Connected accounts", icon: "plug" },
  { id: "clients", label: "Clients", icon: "users" },
];

// Admin-only nav item (Phase 28) — appended dynamically rather than kept in
// BASE_NAV_ITEMS so a client_user session never even sees it rendered, not
// just styled as disabled (the backend 403s the underlying endpoints too —
// see dashboard/api.py's _require_admin — this is UI-layer only).
function navItems() {
  return isAdmin() ? [...BASE_NAV_ITEMS, { id: "admin", label: "Admin", icon: "shield-check" }] : BASE_NAV_ITEMS;
}

const SCREEN_TITLES = {
  calendar: "Calendar",
  queue: "Queue",
  approvals: "Approvals",
  analytics: "Analytics",
  media: "Media library",
  accounts: "Connected accounts",
  clients: "Clients",
  composer: "New post",
  admin: "Admin",
};

const PLATFORM_LETTERS = { youtube: "Y", tiktok: "T", twitter: "X", facebook: "F", instagram: "I" };
const PLATFORM_LABELS = { youtube: "YouTube", tiktok: "TikTok", twitter: "X (Twitter)", facebook: "Facebook", instagram: "Instagram" };

// Composer platform set and per-platform rules, mirroring dashboard/api.py's
// create_job exactly (_VIDEO_UPLOAD_PLATFORMS / _ACCOUNT_REQUIRED_PLATFORMS) —
// pinterest is in the design's platform set but has no publisher (CLAUDE.md
// Phase 26), so it's excluded here.
const COMPOSER_PLATFORMS = ["youtube", "tiktok", "twitter", "facebook", "instagram"];
const VIDEO_UPLOAD_PLATFORMS = new Set(["youtube", "tiktok"]);
const ACCOUNT_REQUIRED_PLATFORMS = new Set(["tiktok", "facebook", "instagram"]);
const TWITTER_CHAR_LIMIT = 280;

const STATUS_STYLE = {
  scheduled: { bg: "#eef6ff", color: "#2c455d", label: "Scheduled" },
  queued: { bg: "#e7e7ea", color: "#424244", label: "Queued" },
  processing: { bg: "#d6ebff", color: "#416180", label: "Processing" },
  published: { bg: "#eef6ff", color: "#1d2d3d", label: "Published" },
  failed: { bg: "#f5e7e7", color: "#7a3030", label: "Failed" },
};

const QUEUE_FILTERS = [
  { id: "all", label: "All" },
  { id: "scheduled", label: "Scheduled" },
  { id: "queued", label: "Queued" },
  { id: "published", label: "Published" },
  { id: "failed", label: "Failed" },
];

const WEEKDAY_LABELS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

const state = {
  auth: null, // null while boot() hasn't resolved yet; else { authenticated, role, client_id, client_name, email }
  authForm: { mode: "login", error: null, success: null, submitting: false },
  admin: { pendingUsers: [], approvedUsers: [], clientsForAssign: [], loading: false, error: null },
  screen: "calendar",
  calendarView: "month",
  monthOffset: 0,
  clients: [],
  clientsLoaded: false,
  activeClientId: null, // null = all workspaces
  clientMenuOpen: false,
  queueFilter: "all",
  jobs: [],
  jobsLoading: false,
  jobsError: null,
  accounts: [],
  accountsLoading: false,
  accountsError: null,
  analytics: null, // AnalyticsSummaryOut | null
  analyticsLoading: false,
  analyticsError: null,
  youtubeConnectNotice: null, // { ok, text } | null — set from ?youtube_connect=... on boot (Phase 29a)
  twitterConnectNotice: null, // { ok, text } | null — set from ?twitter_connect=... on boot (Phase 29b)
  tiktokConnectNotice: null, // { ok, text } | null — set from ?tiktok_connect=... on boot (Phase 29c)
  metaConnectNotice: null, // { ok, text } | null — set from ?meta_connect=... on boot (Phase 29d)
  composer: {
    platform: "youtube",
    accounts: [],
    accountsLoading: false,
    accountsError: null,
    accountId: "",
    submitting: false,
  },
};

function isAdmin() {
  return !!(state.auth && state.auth.authenticated && state.auth.role === "admin");
}

function showApp() {
  document.getElementById("app-root").style.display = "";
  document.getElementById("auth-root").style.display = "none";
}

function showAuth() {
  document.getElementById("app-root").style.display = "none";
  document.getElementById("auth-root").style.display = "";
}

function platformLetter(p) {
  return (PLATFORM_LETTERS[p] || (p ? p[0] : "?")).toUpperCase();
}
function platformLabel(p) {
  return PLATFORM_LABELS[p] || p;
}
function statusStyle(status) {
  return STATUS_STYLE[status] || { bg: "#e7e7ea", color: "#424244", label: status };
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}
function jobDate(job) {
  return job.scheduled_at || job.created_at;
}
function fmtDateLabel(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function fmtTimeLabel(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail || detail;
    } catch (_) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  if (res.status === 204) return null;
  return res.json();
}

async function loadClients() {
  // GET /api/clients is admin-only (Phase 28) — a client_user's own
  // workspace name/id already comes from state.auth (see /api/auth/me),
  // and activeClientLabel() below reads that directly instead.
  if (!isAdmin()) {
    state.clientsLoaded = true;
    return;
  }
  try {
    state.clients = await fetchJson("/api/clients");
  } catch (e) {
    state.clients = [];
  }
  state.clientsLoaded = true;
  renderAll();
}

async function logout() {
  try {
    await fetchJson("/api/auth/logout", { method: "POST" });
  } catch (e) {
    // Ignore — clearing local state and showing the Login screen is the
    // right outcome even if the network call itself failed.
  }
  state.auth = { authenticated: false };
  state.authForm = { mode: "login", error: null, success: null, submitting: false };
  state.screen = "calendar";
  showAuth();
  renderAuthScreen();
}

async function loadJobs() {
  state.jobsLoading = true;
  state.jobsError = null;
  renderAll();
  const params = new URLSearchParams({ limit: "500" });
  if (state.activeClientId != null) params.set("client_id", state.activeClientId);
  try {
    state.jobs = await fetchJson("/api/jobs?" + params.toString());
  } catch (e) {
    state.jobsError = e.message;
  }
  state.jobsLoading = false;
  renderAll();
}

async function loadAccounts() {
  state.accountsLoading = true;
  state.accountsError = null;
  renderAll();
  const params = new URLSearchParams();
  if (state.activeClientId != null) params.set("client_id", state.activeClientId);
  try {
    state.accounts = await fetchJson("/api/accounts?" + params.toString());
  } catch (e) {
    state.accountsError = e.message;
  }
  state.accountsLoading = false;
  renderAll();
}

async function loadAnalytics() {
  state.analyticsLoading = true;
  state.analyticsError = null;
  renderAll();
  const params = new URLSearchParams();
  if (state.activeClientId != null) params.set("client_id", state.activeClientId);
  const qs = params.toString();
  try {
    state.analytics = await fetchJson("/api/analytics/summary" + (qs ? "?" + qs : ""));
  } catch (e) {
    state.analyticsError = e.message;
  }
  state.analyticsLoading = false;
  renderAll();
}

async function loadComposerAccounts() {
  const c = state.composer;
  c.accountsLoading = true;
  c.accountsError = null;
  renderAll();
  const params = new URLSearchParams({ platform: c.platform });
  if (state.activeClientId != null) params.set("client_id", state.activeClientId);
  try {
    c.accounts = await fetchJson("/api/accounts?" + params.toString());
  } catch (e) {
    c.accounts = [];
    c.accountsError = e.message;
  }
  if (!c.accounts.some((a) => String(a.id) === c.accountId)) c.accountId = "";
  c.accountsLoading = false;
  renderAll();
}

function openComposer() {
  state.composer = {
    platform: "youtube",
    accounts: [],
    accountsLoading: false,
    accountsError: null,
    accountId: "",
    submitting: false,
  };
  goScreen("composer");
  loadComposerAccounts();
}

function setComposerPlatform(platform) {
  if (state.composer.platform === platform) return;
  state.composer.platform = platform;
  state.composer.accountId = "";
  renderAll();
  loadComposerAccounts();
}

async function retryJob(id) {
  const btn = document.querySelector(`[data-retry-id="${id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "Retrying…"; }
  try {
    await fetchJson(`/api/jobs/${id}/retry`, { method: "POST" });
    await loadJobs();
  } catch (e) {
    alert(`Retry failed: ${e.message}`);
    renderAll();
  }
}

async function addClientWorkspace() {
  const name = window.prompt("Client workspace name (e.g. \"Bloom Studio\"):");
  if (!name || !name.trim()) return;
  const isIndividual = window.confirm(
    "Is this your own brand (Individual)?\nOK = Individual, Cancel = Agency client"
  );
  try {
    const client = await fetchJson("/api/clients", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim(), kind: isIndividual ? "individual" : "client" }),
    });
    state.clients.push(client);
    state.activeClientId = client.id;
    state.clientMenuOpen = false;
    renderAll();
    if (state.screen === "calendar" || state.screen === "queue") loadJobs();
    if (state.screen === "accounts") loadAccounts();
    if (state.screen === "analytics") loadAnalytics();
  } catch (e) {
    alert(`Could not create client workspace: ${e.message}`);
  }
}

function selectClient(id) {
  state.activeClientId = id;
  state.clientMenuOpen = false;
  renderAll();
  if (state.screen === "calendar" || state.screen === "queue") loadJobs();
  if (state.screen === "accounts") loadAccounts();
  if (state.screen === "analytics") loadAnalytics();

function toggleClientMenu() {
  state.clientMenuOpen = !state.clientMenuOpen;

function goScreen(id) {
  state.screen = id;
  state.clientMenuOpen = false;
  renderAll();
  if ((id === "calendar" || id === "queue") && !state.jobsLoading && state.jobs.length === 0 && !state.jobsError) {
    loadJobs();

  if (id === "accounts") loadAccounts();
  if (id === "analytics") loadAnalytics();
  if (id === "admin" && isAdmin()) loadAdminData();
}

function activeClientLabel() {
  if (!isAdmin()) {
    // client_user sessions are permanently scoped to one client (see
    // boot()/submitLogin, which set activeClientId from the session) —
    // there's no "all workspaces" concept for them and no /api/clients
    // access to resolve a name from, so state.auth.client_name is used.
    const name = (state.auth && state.auth.client_name) || "Your workspace";
    return { initial: name.trim()[0].toUpperCase(), name };
  }
  if (state.activeClientId == null) return { initial: "*", name: "All workspaces" };
  const c = state.clients.find((c) => c.id === state.activeClientId);
  if (!c) return { initial: "*", name: "All workspaces" };
  return { initial: c.name.trim()[0].toUpperCase(), name: c.name };
}

function renderClientSwitch() {
  const wrap = document.getElementById("client-switch");
  const active = activeClientLabel();

  if (!isAdmin()) {
    // No dropdown/switcher for a client_user — just a static label (Phase
    // 28 requirement: "no client switcher, that's admin-only").
    wrap.innerHTML = `
      <div class="client-switch-btn" style="cursor:default;">
        <div class="client-initial">${escapeHtml(active.initial)}</div>
        <div class="name">${escapeHtml(active.name)}</div>
      </div>
    `;
    return;
  }

  let menuHtml = "";
  if (state.clientMenuOpen) {
    const allItem = `
      <button class="client-menu-item" data-select-client="__all__">
        <div class="client-initial">*</div>
        <div style="flex:1;">All workspaces</div>
      </button>`;
    const clientItems = state.clients
      .map(
        (c) => `
      <button class="client-menu-item" data-select-client="${c.id}">
        <div class="client-initial">${escapeHtml(c.name.trim()[0].toUpperCase())}</div>
        <div style="flex:1;">${escapeHtml(c.name)}</div>
        <div class="kind">${escapeHtml(c.kind)}</div>
      </button>`
      )
      .join("");
    menuHtml = `
      <div class="client-menu">
        ${allItem}
        ${clientItems}
        <button class="client-menu-add" id="add-client-btn">
          <i data-lucide="plus"></i> Add client workspace
        </button>
      </div>`;
  }

  wrap.innerHTML = `
    <button class="client-switch-btn" id="client-switch-btn">
      <div class="client-initial">${escapeHtml(active.initial)}</div>
      <div class="name">${escapeHtml(active.name)}</div>
      <i data-lucide="chevron-down"></i>
    </button>
    ${menuHtml}
  `;

  document.getElementById("client-switch-btn").addEventListener("click", (e) => {
    // stopPropagation matters here: the document-level "close on outside
    // click" listener below checks wrap.contains(e.target), but
    // toggleClientMenu's renderAll() synchronously replaces this button
    // with a new DOM node, leaving e.target detached by the time that
    // listener runs — .contains() on a detached node is always false, so
    // the menu opened and then immediately closed on this same click.
    // Stopping propagation keeps this click from reaching that handler.
    e.stopPropagation();
    toggleClientMenu();
  });
  if (state.clientMenuOpen) {
    wrap.querySelectorAll("[data-select-client]").forEach((el) => {
      el.addEventListener("click", () => {
        const v = el.getAttribute("data-select-client");
        selectClient(v === "__all__" ? null : Number(v));
      });
    });
    document.getElementById("add-client-btn").addEventListener("click", addClientWorkspace);
  }
}

function renderTopbar() {
  document.getElementById("screen-title").textContent = SCREEN_TITLES[state.screen] || "";
  renderClientSwitch();
}

function monthCells(year, month, jobs) {
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) {
    const dayJobs = jobs.filter((j) => {
      const d = new Date(jobDate(j));
      return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
    });
    cells.push({ day, jobs: dayJobs });
  }
  return cells;
}

function renderCalendar() {
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth() + state.monthOffset, 1);
  const year = target.getFullYear();
  const month = target.getMonth();
  const monthLabel = target.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const clientLabel = activeClientLabel().name;

  let body = "";
  if (state.jobsLoading) {
    body = `<div class="empty-state">Loading…</div>`;
  } else if (state.jobsError) {
    body = `<div class="error-state">Failed to load jobs: ${escapeHtml(state.jobsError)}</div>`;
  } else if (state.calendarView === "month") {
    const cells = monthCells(year, month, state.jobs);
    body = `
      <div class="month-grid-wrap">
        <div class="reg-mark reg-tl"></div><div class="reg-mark reg-tr"></div>
        <div class="reg-mark reg-bl"></div><div class="reg-mark reg-br"></div>
        <div class="month-grid">
          ${WEEKDAY_LABELS.map((wd) => `<div class="weekday-cell">${wd}</div>`).join("")}
          ${cells
            .map((cell) => {
              if (!cell) return `<div class="day-cell faded"></div>`;
              const shown = cell.jobs.slice(0, 2);
              const overflow = Math.max(0, cell.jobs.length - 2);
              return `
                <div class="day-cell">
                  <div class="day-num">${cell.day}</div>
                  <div class="day-jobs">
                    ${shown
                      .map((j) => {
                        const s = statusStyle(j.status);
                        const cap = j.caption || "(no caption)";
                        const short = cap.length > 26 ? cap.slice(0, 26) + "…" : cap;
                        return `<div class="job-chip" style="background:${s.bg};color:${s.color};" title="${escapeHtml(cap)}">
                          <span class="letter">${escapeHtml(platformLetter(j.platform))}</span>
                          <span class="caption">${escapeHtml(short)}</span>
                        </div>`;
                      })
                      .join("")}
                    ${overflow > 0 ? `<div class="day-overflow">+${overflow} more</div>` : ""}
                  </div>
                </div>`;
            })
            .join("")}
        </div>
      </div>`;
  } else {
    const sorted = state.jobs.slice().sort((a, b) => new Date(jobDate(a)) - new Date(jobDate(b)));
    const groups = {};
    const order = [];
    sorted.forEach((j) => {
      const label = fmtDateLabel(jobDate(j));
      if (!groups[label]) { groups[label] = []; order.push(label); }
      groups[label].push(j);
    });
    if (order.length === 0) {
      body = `<div class="empty-state">No posts scheduled${state.activeClientId != null ? " for this client" : ""}.</div>`;
    } else {
      body = order
        .map(
          (label) => `
        <div class="agenda-group">
          <div class="agenda-group-label">${escapeHtml(label)}</div>
          <div>
            ${groups[label]
              .map((j) => {
                const s = statusStyle(j.status);
                return `
              <div class="agenda-row">
                <div class="agenda-time">${escapeHtml(fmtTimeLabel(jobDate(j)))}</div>
                <div class="platform-box">${escapeHtml(platformLetter(j.platform))}</div>
                <div class="agenda-caption">${escapeHtml(j.caption || "(no caption)")}</div>
                <div class="agenda-client">${escapeHtml(j.client_name || "—")}</div>
                <div class="status-pill" style="background:${s.bg};color:${s.color};">${escapeHtml(s.label)}</div>
              </div>`;
              })
              .join("")}
          </div>
        </div>`
        )
        .join("");
    }
  }

  return `
    <div class="calendar-toolbar">
      <div class="calendar-context">
        <button class="month-nav-btn" id="month-prev"><i data-lucide="chevron-left"></i></button>
        <span>${escapeHtml(monthLabel)} · ${escapeHtml(clientLabel)}</span>
        <button class="month-nav-btn" id="month-next"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="seg-control">
        <button class="seg-btn ${state.calendarView === "month" ? "active" : ""}" id="view-month">Month</button>
        <button class="seg-btn ${state.calendarView === "agenda" ? "active" : ""}" id="view-agenda">Agenda</button>
      </div>
    </div>
    ${body}
  `;
}

function renderQueue() {
  let rowsHtml = "";
  let bodyHtml = "";

  if (state.jobsLoading) {
    bodyHtml = `<div class="empty-state">Loading…</div>`;
  } else if (state.jobsError) {
    bodyHtml = `<div class="error-state">Failed to load jobs: ${escapeHtml(state.jobsError)}</div>`;
  } else {
    const filtered = state.jobs
      .filter((j) => state.queueFilter === "all" || j.status === state.queueFilter)
      .slice()
      .sort((a, b) => new Date(jobDate(b)) - new Date(jobDate(a)));

    if (filtered.length === 0) {
      bodyHtml = `<div class="empty-state">No jobs match this filter.</div>`;
    } else {
      rowsHtml = filtered
        .map((j) => {
          const s = statusStyle(j.status);
          return `
        <tr>
          <td><div class="platform-box" title="${escapeHtml(platformLabel(j.platform))}">${escapeHtml(platformLetter(j.platform))}</div></td>
          <td class="truncate" title="${escapeHtml(j.caption || "")}">
            ${escapeHtml(j.caption || "(no caption)")}
            ${
              j.status === "failed" && j.error_message
                ? `<div style="color:#7a3030;font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(j.error_message)}">${escapeHtml(j.error_message)}</div>`
                : ""
            }
          </td>
          <td class="muted">${escapeHtml(j.client_name || "—")}</td>
          <td class="muted">${escapeHtml(fmtDateLabel(jobDate(j)))} · ${escapeHtml(fmtTimeLabel(jobDate(j)))}</td>
          <td><span class="status-pill" style="background:${s.bg};color:${s.color};">${escapeHtml(s.label)}</span></td>
          <td style="text-align:right;">
            ${
              j.status === "failed"
                ? `<button class="retry-link" data-retry-id="${j.id}"><i data-lucide="rotate-ccw"></i> Retry</button>`
                : ""
            }
          </td>
        </tr>`;
        })
        .join("");

      bodyHtml = `
        <table class="data-table">
          <thead>
            <tr>
              <th>Platform</th><th>Post</th><th>Client</th><th>Scheduled</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;
    }
  }

  return `
    <div class="filter-chips">
      ${QUEUE_FILTERS.map(
        (f) => `<button class="filter-chip ${state.queueFilter === f.id ? "active" : ""}" data-queue-filter="${f.id}">${escapeHtml(f.label)}</button>`
      ).join("")}
    </div>
    ${bodyHtml}
  `;
}

function renderAccounts() {
  // Self-service connect (Phase 29a YouTube, Phase 29b Twitter/X, Phase 29c
  // TikTok, Phase 29d Facebook + Instagram) is client_user-only — an admin
  // isn't scoped to any one Client, so the backend routes
  // (dashboard/api.py's /api/oauth/{youtube,twitter,tiktok,meta}/start) 403
  // it too; hiding the buttons for admin is UI convenience on top of that
  // real boundary, same convention as the Admin nav item being hidden for a
  // client_user.
  const canConnectPlatforms = !!(state.auth && state.auth.role === "client_user");
  const connectHtml = canConnectPlatforms
    ? `<div style="margin-bottom:16px;display:flex;gap:10px;">
        <a class="btn-primary" style="text-decoration:none;" href="/api/oauth/youtube/start">Connect YouTube</a>
        <a class="btn-primary" style="text-decoration:none;" href="/api/oauth/twitter/start">Connect X/Twitter</a>
        <a class="btn-primary" style="text-decoration:none;" href="/api/oauth/tiktok/start">Connect TikTok</a>
        <a class="btn-primary" style="text-decoration:none;" href="/api/oauth/meta/start">Connect Facebook & Instagram</a>
      </div>`
    : "";

  let body;
  if (state.accountsLoading) {
    body = `<div class="empty-state">Loading…</div>`;
  } else if (state.accountsError) {
    body = `<div class="error-state">Failed to load accounts: ${escapeHtml(state.accountsError)}</div>`;
  } else if (state.accounts.length === 0) {
    body = `<div class="empty-state">No connected accounts${state.activeClientId != null ? " for this client" : ""} yet.</div>`;
  } else {
    body = `
      <div class="accounts-list">
        ${state.accounts
          .map(
            (a) => `
          <div class="account-row">
            <div class="platform-box" style="width:24px;height:24px;">${escapeHtml(platformLetter(a.platform))}</div>
            <div style="flex:1;">
              <div class="account-name">${escapeHtml(a.name)} <span class="muted" style="color:var(--muted);font-size:11px;">· ${escapeHtml(platformLabel(a.platform))}</span></div>
              <div class="account-sub">${escapeHtml(a.client_name || "No client workspace")}</div>

          </div>`
          )
          .join("")}
      </div>`;
  }
  const renderNotice = (notice) =>
    notice
      ? notice.ok
        ? `<div style="margin-bottom:16px;padding:10px 14px;border:1px solid var(--border);background:#eef6ff;color:#2c455d;font-size:13px;">${escapeHtml(notice.text)}</div>`
        : `<div class="error-state" style="margin-bottom:16px;">${escapeHtml(notice.text)}</div>`

    renderNotice(state.youtubeConnectNotice) +
    renderNotice(state.twitterConnectNotice) +
    renderNotice(state.tiktokConnectNotice) +
    renderNotice(state.metaConnectNotice);
  return `
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Connected platforms for ${escapeHtml(activeClientLabel().name)}</div>
    ${noticeHtml}
    ${connectHtml}
    ${body}
    <p style="font-size:12px;color:var(--muted);margin-top:16px;">YouTube, X/Twitter, TikTok and Facebook/Instagram can be connected above (Phases 29a/29b/29c/29d); every other platform's onboarding isn't built in this UI yet — use the <code>scripts/authorize_*.py</code> CLI scripts, then it shows up here.</p>
  `;
}

function renderComposer() {
  const c = state.composer;
  const chips = COMPOSER_PLATFORMS.map((p) => {
    const active = c.platform === p;
    return `<button type="button" class="filter-chip${active ? " active" : ""}" data-composer-platform="${p}">${escapeHtml(platformLetter(p))} ${escapeHtml(platformLabel(p))}</button>`;
  }).join("");

  const accountRequired = ACCOUNT_REQUIRED_PLATFORMS.has(c.platform);
  let accountFieldHtml;
  if (c.accountsLoading) {
    accountFieldHtml = `<div class="form-hint">Loading accounts…</div>`;
  } else if (c.accountsError) {
    accountFieldHtml = `<div class="error-state">Failed to load accounts: ${escapeHtml(c.accountsError)}</div>`;
  } else {
    const fallbackOption = accountRequired
      ? ""
      : `<option value="" ${c.accountId === "" ? "selected" : ""}>No account (single-account fallback)</option>`;
    const options = c.accounts
      .map((a) => `<option value="${a.id}" ${String(a.id) === c.accountId ? "selected" : ""}>${escapeHtml(a.name)}</option>`)
      .join("");
    accountFieldHtml = `
      <select id="composer-account" class="form-input">
        ${fallbackOption}
        ${options}
      </select>
      ${
        c.accounts.length === 0 && accountRequired
          ? `<div class="form-hint form-hint-warn">No ${escapeHtml(platformLabel(c.platform))} accounts connected${state.activeClientId != null ? " for this client" : ""} — this platform has no single-account fallback, so connect one first (see scripts/authorize_*.py).</div>`
          : ""
      }

  }

  return `
    <form id="composer-form" class="composer-layout">
      <div class="composer-col-left">
        <div class="form-group">
          <div class="form-label">Platform</div>
          <div class="composer-platform-chips">${chips}</div>
        </div>
        <div class="form-group">
          <div class="form-label">Account</div>
          ${accountFieldHtml}
        </div>
        ${renderComposerPlatformFields(c.platform)}
        <div id="composer-error"></div>
        <div class="composer-actions">
          <button type="button" class="btn-secondary" id="composer-cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="composer-submit" ${c.submitting ? "disabled" : ""}>${c.submitting ? "Posting…" : "Add to queue"}</button>
        </div>
      </div>
      <div class="composer-col-right">
        <div class="form-label">Live preview</div>
        <div class="preview-card" id="composer-preview"></div>
      </div>
    </form>
  `;
}

function updateComposerPreview() {
  const c = state.composer;
  const preview = document.getElementById("composer-preview");
  if (!preview) return;

  const textEl = document.getElementById("composer-text");
  const titleEl = document.getElementById("composer-title");
  const captionText = textEl ? textEl.value : titleEl ? titleEl.value : "";

  let mediaLabel = "No media selected";
  const singleFileEl = document.getElementById("composer-file") || document.getElementById("composer-media-file");
  const multiFileEl = document.getElementById("composer-media-files");
  if (singleFileEl && singleFileEl.files && singleFileEl.files.length) {
    mediaLabel = singleFileEl.files[0].name;
  } else if (multiFileEl && multiFileEl.files && multiFileEl.files.length) {
    mediaLabel = `${multiFileEl.files.length} file${multiFileEl.files.length > 1 ? "s" : ""} selected`;
  }

  let counterHtml = "";
  if (c.platform === "twitter") {
    const len = textEl ? textEl.value.length : 0;
    const over = len > TWITTER_CHAR_LIMIT;
    counterHtml = `<div class="char-counter${over ? " over" : ""}">${len}/${TWITTER_CHAR_LIMIT}</div>`;
  }

  preview.innerHTML = `
    <div class="preview-header">
      <div class="platform-box">${escapeHtml(platformLetter(c.platform))}</div>
      <div class="preview-platform-label">${escapeHtml(platformLabel(c.platform))}</div>
      ${counterHtml}
    </div>
    <div class="preview-media">${escapeHtml(mediaLabel)}</div>
    <div class="preview-text">${captionText ? escapeHtml(captionText) : '<span style="color:var(--muted);">(no caption)</span>'}</div>
  `;
}

function setComposerError(message) {
  const el = document.getElementById("composer-error");
  if (el) el.innerHTML = message ? `<div class="error-state">${escapeHtml(message)}</div>` : "";
}

async function submitComposer(e) {
  e.preventDefault();
  const c = state.composer;
  if (c.submitting) return;
  setComposerError(null);

  const platform = c.platform;
  const fd = new FormData();
  fd.append("platform", platform);
  if (state.activeClientId != null) fd.append("client_id", state.activeClientId);

  if (c.accountId) {
    fd.append("account_id", c.accountId);
  } else if (ACCOUNT_REQUIRED_PLATFORMS.has(platform)) {
    setComposerError(`${platformLabel(platform)} requires a connected account — none selected.`);
    return;
  }

  if (VIDEO_UPLOAD_PLATFORMS.has(platform)) {
    const fileEl = document.getElementById("composer-file");
    const file = fileEl && fileEl.files[0];
    if (!file) {
      setComposerError("A video file is required.");
      return;
    }
    fd.append("file", file);
    const title = document.getElementById("composer-title").value.trim();
    if (title) fd.append("title", title);
    if (platform === "youtube") {
      fd.append("privacy", document.getElementById("composer-privacy").value);
      if (document.getElementById("composer-shorts").checked) fd.append("shorts", "true");
      const playlistId = document.getElementById("composer-playlist").value.trim();
      if (playlistId) fd.append("playlist_id", playlistId);
    }
  } else if (platform === "twitter") {
    const text = document.getElementById("composer-text").value.trim();
    if (!text) {
      setComposerError("Text is required for a tweet.");
      return;
    }
    fd.append("text", text);
    const filesEl = document.getElementById("composer-media-files");
    Array.from((filesEl && filesEl.files) || []).forEach((f) => fd.append("media_files", f));
  } else if (platform === "facebook") {
    const text = document.getElementById("composer-text").value.trim();
    const fileEl = document.getElementById("composer-media-file");
    const file = fileEl && fileEl.files[0];
    if (!text && !file) {
      setComposerError("Add text and/or a media file.");
      return;
    }
    if (text) fd.append("text", text);
    if (file) fd.append("media_files", file);
  } else {
    // instagram
    const fileEl = document.getElementById("composer-media-file");
    const file = fileEl && fileEl.files[0];
    if (!file) {
      setComposerError("A media file is required for Instagram.");
      return;
    }
    fd.append("media_files", file);
    const text = document.getElementById("composer-text").value.trim();
    if (text) fd.append("text", text);
  }

  c.submitting = true;
  const submitBtn = document.getElementById("composer-submit");
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = "Posting…";
  }
  try {
    await fetchJson("/api/jobs", { method: "POST", body: fd });
    c.submitting = false;
    goScreen("queue");
    await loadJobs();
  } catch (err) {
    c.submitting = false;
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Add to queue";
    }
    setComposerError(err.message);
  }
}

function wireComposerEvents() {
  document.querySelectorAll("[data-composer-platform]").forEach((btn) => {
    btn.addEventListener("click", () => setComposerPlatform(btn.getAttribute("data-composer-platform")));
  });

  const accountSel = document.getElementById("composer-account");
  if (accountSel) {
    accountSel.addEventListener("change", () => {
      state.composer.accountId = accountSel.value;
    });
  }

  ["composer-text", "composer-title"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", updateComposerPreview);
  });
  ["composer-file", "composer-media-file", "composer-media-files"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", updateComposerPreview);
  });

  const form = document.getElementById("composer-form");
  if (form) form.addEventListener("submit", submitComposer);
  const cancelBtn = document.getElementById("composer-cancel");
  if (cancelBtn) cancelBtn.addEventListener("click", () => goScreen("queue"));
}

async function loadAdminData() {
  const a = state.admin;
  a.loading = true;
  a.error = null;
  renderAll();
  try {
    const [pending, approved, clients] = await Promise.all([
      fetchJson("/api/admin/users/pending"),
      fetchJson("/api/admin/users"),
      fetchJson("/api/clients"),
    ]);
    a.pendingUsers = pending;
    a.approvedUsers = approved;
    a.clientsForAssign = clients;
  } catch (e) {
    a.error = e.message;
  }
  a.loading = false;
  renderAll();
}

async function approveUser(userId) {
  const select = document.querySelector(`[data-approve-client="${userId}"]`);
  const clientId = select && select.value;
  if (!clientId) {
    alert("Select a client to assign before approving.");
    return;
  }
  try {
    await fetchJson(`/api/admin/users/${userId}/approve`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ client_id: Number(clientId) }),
    });
    await loadAdminData();
  } catch (e) {
    alert(`Approve failed: ${e.message}`);
  }
}

async function rejectUser(userId) {
  if (!window.confirm("Reject and delete this registration request? This cannot be undone.")) return;
  try {
    await fetchJson(`/api/admin/users/${userId}/reject`, { method: "POST" });
    await loadAdminData();
  } catch (e) {
    alert(`Reject failed: ${e.message}`);
  }
}

function renderAdmin() {
  const a = state.admin;
  if (a.loading) return `<div class="empty-state">Loading…</div>`;
  if (a.error) return `<div class="error-state">Failed to load admin data: ${escapeHtml(a.error)}</div>`;

  const pendingRows =
    a.pendingUsers.length === 0
      ? `<tr><td colspan="4" class="empty-state">No pending registrations.</td></tr>`
      : a.pendingUsers
          .map((u) => {
            const guess = a.clientsForAssign.find(
              (c) => c.name.trim().toLowerCase() === (u.requested_client_name || "").trim().toLowerCase()
            );
            const options = a.clientsForAssign
              .map((c) => `<option value="${c.id}" ${guess && guess.id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`)
              .join("");
            return `
        <tr>
          <td>${escapeHtml(u.email)}</td>
          <td class="muted">${escapeHtml(u.requested_client_name || "—")}</td>
          <td>
            <select class="form-input" data-approve-client="${u.id}" style="min-height:30px;">

          })
          .join("");

  const approvedRows =
    a.approvedUsers.length === 0
      ? `<tr><td colspan="3" class="empty-state">No approved users yet.</td></tr>`
      : a.approvedUsers
          .map(
            (u) => `
        <tr>
          <td>${escapeHtml(u.email)}</td>
          <td class="muted">${escapeHtml(u.client_name || "—")}</td>
          <td class="muted">${escapeHtml(u.role)}</td>
        </tr>`
          )
          .join("");

  return `
    <div class="admin-section">
      <div class="heading admin-section-title">Pending registrations</div>
      <table class="data-table">
        <thead><tr><th>Email</th><th>Requested client</th><th>Assign to</th><th></th></tr></thead>
        <tbody>${pendingRows}</tbody>
      </table>
    </div>
    <div>
      <div class="heading admin-section-title">Approved users</div>
      <table class="data-table">
        <thead><tr><th>Email</th><th>Client</th><th>Role</th></tr></thead>
        <tbody>${approvedRows}</tbody>

    </div>

}

function renderAnalytics() {
  if (state.analyticsError) {
    return `<div class="error-state">Failed to load analytics: ${escapeHtml(state.analyticsError)}</div>`;
  }
  const a = state.analytics;
  if (!a) {
    return `<div class="empty-state">Loading…</div>`;
  }

  const rated = a.published + a.failed;
  const successLabel = rated === 0 ? "—" : (a.success_rate * 100).toFixed(1) + "%";
  const cards = [
    { label: "Total jobs", value: a.total },
    { label: "Published", value: a.published },
    { label: "Failed", value: a.failed },
    { label: "Success rate", value: successLabel },
  ];
  const cardsHtml = cards
    .map(
      (c) => `
      <div class="stat-card">
        <span class="reg-mark reg-tl"></span><span class="reg-mark reg-tr"></span>
        <span class="reg-mark reg-bl"></span><span class="reg-mark reg-br"></span>
        <div class="stat-label">${escapeHtml(c.label)}</div>
        <div class="stat-value">${escapeHtml(c.value)}</div>
      </div>`
    )
    .join("");

  const series = a.time_series || [];
  const maxCount = series.reduce((m, p) => Math.max(m, p.count), 0);
  const barsHtml = series
    .map((p) => {
      const h = maxCount === 0 || p.count === 0 ? 0 : Math.max(4, Math.round((p.count / maxCount) * 120));
      return `<div class="bar-col" title="${escapeHtml(p.date)}: ${p.count}"><div class="bar-fill ${
        p.count === 0 ? "empty" : ""
      }" style="height:${h}px;"></div></div>`;
    })
    .join("");
  const axisHtml = series
    .map((p, i) => `<div>${i % 5 === 0 ? escapeHtml(fmtDateLabel(p.date)) : ""}</div>`)
    .join("");

  const rows = a.platform_breakdown || [];
  const rowsHtml =
    rows.length === 0
      ? `<tr><td colspan="5" class="empty-state">No jobs yet.</td></tr>`
      : rows
          .map(
            (r) => `
        <tr>
          <td><div class="platform-box" title="${escapeHtml(platformLabel(r.platform))}">${escapeHtml(
              platformLetter(r.platform)
            )}</div></td>
          <td>${r.total}</td>
          <td>${r.published}</td>
          <td>${r.failed}</td>
          <td class="muted">${
            r.last_activity
              ? escapeHtml(fmtDateLabel(r.last_activity)) + " · " + escapeHtml(fmtTimeLabel(r.last_activity))
              : "—"
          }</td>
        </tr>`
          )
          .join("");

  return `
    <div class="stat-cards">${cardsHtml}</div>

    <div class="analytics-section">
      <div class="analytics-section-label">Jobs created, last ${series.length} days</div>
      <div class="bar-chart">${barsHtml}</div>
      <div class="bar-axis">${axisHtml}</div>
    </div>

    <div class="analytics-section">
      <div class="analytics-section-label">By platform</div>
      <table class="data-table">
        <thead>
          <tr><th>Platform</th><th>Total</th><th>Published</th><th>Failed</th><th>Last activity</th></tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

function renderContent() {
  const el = document.getElementById("content");
  switch (state.screen) {
    case "calendar":
      el.innerHTML = renderCalendar();
      document.getElementById("month-prev").addEventListener("click", () => shiftMonth(-1));
      document.getElementById("month-next").addEventListener("click", () => shiftMonth(1));
      document.getElementById("view-month").addEventListener("click", () => setCalendarView("month"));
      document.getElementById("view-agenda").addEventListener("click", () => setCalendarView("agenda"));
      break;
    case "queue":
      el.innerHTML = renderQueue();
      el.querySelectorAll("[data-queue-filter]").forEach((btn) => {
        btn.addEventListener("click", () => setQueueFilter(btn.getAttribute("data-queue-filter")));
      });
      el.querySelectorAll("[data-retry-id]").forEach((btn) => {
        btn.addEventListener("click", () => retryJob(Number(btn.getAttribute("data-retry-id"))));
      });
      break;
    case "accounts":
      el.innerHTML = renderAccounts();
      break;
    case "approvals":
      el.innerHTML = renderPlaceholder("Approvals");
      break;
    case "analytics":
      el.innerHTML = renderAnalytics();
      break;
    case "media":
      el.innerHTML = renderPlaceholder("Media library");
      break;
    case "clients":
      el.innerHTML = renderPlaceholder("Clients");
      break;
    case "composer":
      el.innerHTML = renderComposer();
      wireComposerEvents();
      updateComposerPreview();
      break;
    case "admin":
      if (!isAdmin()) {
        el.innerHTML = renderPlaceholder("Admin");
        break;
      }
      el.innerHTML = renderAdmin();
      el.querySelectorAll("[data-approve-user]").forEach((btn) => {
        btn.addEventListener("click", () => approveUser(Number(btn.getAttribute("data-approve-user"))));
      });
      el.querySelectorAll("[data-reject-user]").forEach((btn) => {
        btn.addEventListener("click", () => rejectUser(Number(btn.getAttribute("data-reject-user"))));
      });
      break;
    default:
      el.innerHTML = renderPlaceholder(state.screen);
  }
}

function wireAuthEvents() {
  const goRegister = document.getElementById("go-register");
  if (goRegister) {
    goRegister.addEventListener("click", () => {
      state.authForm = { mode: "register", error: null, success: null, submitting: false };
      renderAuthScreen();
    });
  }
  const goLogin = document.getElementById("go-login");
  if (goLogin) {
    goLogin.addEventListener("click", () => {
      state.authForm = { mode: "login", error: null, success: null, submitting: false };
      renderAuthScreen();
    });
  }
  const loginForm = document.getElementById("login-form");
  if (loginForm) loginForm.addEventListener("submit", submitLogin);
  const registerForm = document.getElementById("register-form");
  if (registerForm) registerForm.addEventListener("submit", submitRegister);
}

async function submitLogin(e) {
  e.preventDefault();
  // Read the fields BEFORE re-rendering: renderAuthScreen() regenerates the
  // form's innerHTML from scratch (these are uncontrolled inputs, same as
  // the Composer form), which would otherwise wipe whatever was just typed
  // the instant the "submitting…" state renders.
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;

  const f = state.authForm;
  f.submitting = true;
  f.error = null;
  renderAuthScreen();

  try {
    const me = await fetchJson("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    state.auth = me;
    state.screen = "calendar";
    if (!isAdmin()) state.activeClientId = me.client_id;
    showApp();
    renderAll();
    loadClients();
    loadJobs();
  } catch (err) {
    f.submitting = false;
    f.error = err.message || "Invalid email or password.";
    renderAuthScreen();
  }
}

async function submitRegister(e) {
  e.preventDefault();
  // Same ordering fix as submitLogin above: read before re-rendering.
  const email = document.getElementById("register-email").value.trim();
  const password = document.getElementById("register-password").value;
  const clientName = document.getElementById("register-client").value.trim();

  const f = state.authForm;
  f.submitting = true;
  f.error = null;
  f.success = null;
  renderAuthScreen();

  try {
    const res = await fetchJson("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, client_name: clientName }),
    });
    f.submitting = false;
    f.success = res.detail || "Request submitted.";
    renderAuthScreen();
  } catch (err) {
    f.submitting = false;
    f.error = err.message || "Could not submit your request.";
    renderAuthScreen();
  }
}

// Reads ?screen=...&youtube_connect=success|error&reason=... (Phase 29a),
// ?twitter_connect=success|error&reason=... (Phase 29b),
// ?tiktok_connect=success|error&reason=... (Phase 29c) or
// ?meta_connect=success|error&reason=...&facebook=N&instagram=M (Phase 29d)
// left by the /api/oauth/{youtube,twitter,tiktok,meta}/callback redirect —
// a full-page browser navigation, so this is how those routes report their
// outcome back into the SPA instead of a fetch() response — and strips them
// from the URL via history.replaceState so a page refresh doesn't re-show
// the same notice.
function consumeOauthRedirectParams() {
  const params = new URLSearchParams(window.location.search);
  const screen = params.get("screen");
  if (screen && SCREEN_TITLES[screen]) state.screen = screen;

  const youtubeConnect = params.get("youtube_connect");
  if (youtubeConnect === "success") {
    state.youtubeConnectNotice = { ok: true, text: "YouTube account connected." };
  } else if (youtubeConnect === "error") {
    const reason = params.get("reason") || "unknown_error";
    state.youtubeConnectNotice = { ok: false, text: `Could not connect YouTube (${reason}). Please try again.` };
  }

  const twitterConnect = params.get("twitter_connect");
  if (twitterConnect === "success") {
    state.twitterConnectNotice = { ok: true, text: "X/Twitter account connected." };
  } else if (twitterConnect === "error") {
    const reason = params.get("reason") || "unknown_error";
    state.twitterConnectNotice = { ok: false, text: `Could not connect X/Twitter (${reason}). Please try again.` };
  }

  const tiktokConnect = params.get("tiktok_connect");
  if (tiktokConnect === "success") {
    state.tiktokConnectNotice = { ok: true, text: "TikTok account connected." };
  } else if (tiktokConnect === "error") {
    const reason = params.get("reason") || "unknown_error";
    state.tiktokConnectNotice = { ok: false, text: `Could not connect TikTok (${reason}). Please try again.` };
  }

  const metaConnect = params.get("meta_connect");
  if (metaConnect === "success") {
    const fbCount = Number(params.get("facebook") || 0);
    const igCount = Number(params.get("instagram") || 0);
    const parts = [];
    if (fbCount) parts.push(`${fbCount} Facebook Page${fbCount === 1 ? "" : "s"}`);
    if (igCount) parts.push(`${igCount} Instagram account${igCount === 1 ? "" : "s"}`);
    state.metaConnectNotice = { ok: true, text: `Connected: ${parts.join(", ") || "no accounts"}.` };
  } else if (metaConnect === "error") {
    const reason = params.get("reason") || "unknown_error";
    state.metaConnectNotice = { ok: false, text: `Could not connect Facebook/Instagram (${reason}). Please try again.` };
  }

  if (screen || youtubeConnect || twitterConnect || tiktokConnect || metaConnect) {
    window.history.replaceState({}, "", window.location.pathname);
  }
}

async function boot() {
  try {
    const me = await fetchJson("/api/auth/me");
    if (me.authenticated) {
      state.auth = me;
      if (!isAdmin()) state.activeClientId = me.client_id;
      consumeOauthRedirectParams();
      showApp();
      renderAll();
      loadClients();
      loadJobs();
      if (state.screen === "accounts") loadAccounts();
      if (state.screen === "analytics") loadAnalytics();
      return;
    }
  } catch (e) {
    // Falls through to the anonymous/login-screen path below.
  }
  state.auth = { authenticated: false };
  showAuth();
  renderAuthScreen();
}

document.getElementById("new-post-btn").addEventListener("click", openComposer);

// Close the client dropdown when clicking outside it.
document.addEventListener("click", (e) => {
  const wrap = document.getElementById("client-switch");
  if (state.clientMenuOpen && wrap && !wrap.contains(e.target)) {
    state.clientMenuOpen = false;
    renderAll();
  }
});

boot();
</script>
