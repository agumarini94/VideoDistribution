<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribution Engine — Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", "Courier New", monospace;

    --bg: #ffffff;
    --ink: #000000;
    --panel: #ffffff;

    --violet: #9D00FF;
    --green: #22C55E;
    --yellow: #FDE047;
    --red: #EF4444;
    --blue: #2B6CFF;
    --gray: #9CA3AF;

    --published: var(--green);
    --failed: var(--red);
    --scheduled: var(--blue);
    --queued: var(--yellow);
    --processing: var(--yellow);
    --neutral: var(--gray);

    --shadow-lg: 4px 4px 0 var(--ink);
    --shadow-sm: 2px 2px 0 var(--ink);
    --border: 3px solid var(--ink);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--ink);
    padding: 0 0 48px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--violet);
    border-bottom: var(--border);
    padding: 20px 32px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  #last-updated {
    color: #fff;
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 700;
  }

  main {
    padding: 0 32px;
  }

  /* Buttons — shared neobrutalist button system: flat bg, black border,
     hard offset shadow; hover presses the button toward the shadow. */
  .btn {
    font-family: var(--font-mono);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    border: var(--border);
    border-radius: 0;
    background: #fff;
    color: var(--ink);
    padding: 9px 18px;
    font-size: 12px;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }

  .btn:hover:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: var(--shadow-sm);
  }

  .btn:active:not(:disabled) {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }

  .btn:disabled { opacity: 0.5; cursor: default; }

  .btn-green { background: var(--green); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 12px;
    margin: 0 32px 24px;
    flex-wrap: wrap;
  }

  .tab-btn.active { background: var(--ink); color: #fff; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: var(--panel);
    border: var(--border);
    box-shadow: var(--shadow-lg);
    padding: 14px 16px;
  }

  .card .label {
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .card .value {
    font-size: 32px;
    font-weight: 800;
    font-family: var(--font-mono);
  }

  .card.published .value { color: var(--published); }
  .card.failed .value { color: var(--failed); }
  .card.scheduled .value { color: var(--scheduled); }
  .card.queued .value,
  .card.processing .value { color: #CA8A04; }

  .filters {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  select, input[type="text"], input[type="file"] {
    background: #fff;
    color: var(--ink);
    border: var(--border);
    box-shadow: var(--shadow-sm);
    border-radius: 0;
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--font-mono);
    font-weight: 700;
  }

  select { text-transform: uppercase; appearance: none; cursor: pointer; }

  select:focus, input:focus {
    outline: none;
    box-shadow: var(--shadow-lg);
  }

  .table-wrap {
    background: var(--panel);
    border: var(--border);
    box-shadow: var(--shadow-lg);
    overflow: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 760px;
  }

  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 3px solid var(--ink);
    border-right: 3px solid var(--ink);
    white-space: nowrap;
  }

  th:last-child, td:last-child { border-right: none; }

  thead th {
    background: var(--violet);
    color: #fff;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 3px solid var(--ink);
  }

  tr:last-child td { border-bottom: none; }

  tr.row-failed td { background: #FEE2E2; }

  td.error-cell {
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: help;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border: 2px solid var(--ink);
    border-radius: 0;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--ink);
  }

  .badge.published { background: var(--green); }
  .badge.failed { background: var(--red); color: #fff; }
  .badge.scheduled { background: var(--blue); color: #fff; }
  .badge.queued, .badge.processing { background: var(--yellow); }

  .badge.platform { background: var(--yellow); }
  .badge.active { background: var(--green); }
  .badge.inactive { background: var(--gray); }

  .empty {
    padding: 24px;
    text-align: center;
    color: var(--ink);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 12px;
  }

  .readonly-note {
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 14px;
  }

  /* New job form */
  .form-card {
    max-width: 480px;
  }

  .field {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field select, .field input { width: 100%; }

  .result-box {
    margin-top: 16px;
    padding: 12px 14px;
    border: var(--border);
    font-size: 13px;
    font-weight: 700;
  }

  .result-box.ok { background: var(--green); }
  .result-box.err { background: var(--red); color: #fff; }
</style>
</head>
<body>

<header>
  <h1>Distribution Engine</h1>
  <div id="last-updated">Loading…</div>
</header>

<nav class="tabs">
  <button class="btn tab-btn active" data-tab="monitor">Monitor</button>
  <button class="btn tab-btn" data-tab="newjob">New Job</button>
  <button class="btn tab-btn" data-tab="accounts">Accounts</button>
</nav>

<main>

<section class="tab-panel active" id="tab-monitor">

  <div class="stat-cards" id="stat-cards"></div>

  <div class="filters">
    <select id="filter-status">
      <option value="">All statuses</option>
    </select>
    <select id="filter-platform">
      <option value="">All platforms</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Platform</th>
          <th>Status</th>
          <th>Attempts</th>
          <th>Scheduled at</th>
          <th>Error</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="jobs-body"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none;">No jobs match the current filters.</div>
  </div>

  <p class="readonly-note">Read-only, except the Retry action on failed jobs. Auto-refreshes every 5s.</p>

</section>

<section class="tab-panel" id="tab-newjob">

  <div class="card form-card">
    <form id="new-job-form">
      <div class="field">
        <label for="job-platform">Platform</label>
        <select id="job-platform" required>
          <option value="">Select platform…</option>
          <option value="youtube">YouTube</option>
          <option value="tiktok">TikTok</option>
        </select>
      </div>

      <div class="field">
        <label for="job-account">Account</label>
        <select id="job-account" disabled>
          <option value="">Select a platform first…</option>
        </select>
      </div>

      <div class="field">
        <label for="job-file">Video file</label>
        <input type="file" id="job-file" accept="video/*" required>
      </div>

      <div class="field">
        <label for="job-title">Title (optional)</label>
        <input type="text" id="job-title" placeholder="Auto-generated if left blank">
      </div>

      <button type="submit" class="btn btn-green" id="job-submit">Create job</button>
    </form>

    <div id="job-result"></div>
  </div>

</section>

<section class="tab-panel" id="tab-accounts">

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Platform</th>
          <th>Name</th>
          <th>Status</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="accounts-body"></tbody>
    </table>
    <div class="empty" id="accounts-empty" style="display:none;">No accounts found.</div>
  </div>

</section>

</main>

<script>
const STATUSES = ["scheduled", "queued", "processing", "published", "failed"];
const REFRESH_MS = 5000;

const statusFilter = document.getElementById("filter-status");
const platformFilter = document.getElementById("filter-platform");
const jobsBody = document.getElementById("jobs-body");
const emptyMsg = document.getElementById("empty-msg");
const lastUpdated = document.getElementById("last-updated");
const statCards = document.getElementById("stat-cards");

STATUSES.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s;
  opt.textContent = s;
  statusFilter.appendChild(opt);
});

let knownPlatforms = new Set();

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail || detail;
    } catch (_) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

function renderStats(stats) {
  statCards.innerHTML = "";
  const order = ["scheduled", "queued", "processing", "published", "failed"];
  order.forEach(status => {
    const card = document.createElement("div");
    card.className = `card ${status}`;
    card.innerHTML = `
      <div class="label">${status}</div>
      <div class="value">${stats.by_status[status] ?? 0}</div>
    `;
    statCards.appendChild(card);
  });
  const total = document.createElement("div");
  total.className = "card";
  total.innerHTML = `<div class="label">Total</div><div class="value">${stats.total}</div>`;
  statCards.appendChild(total);
}

function renderPlatformOptions(jobs) {
  const platforms = new Set(jobs.map(j => j.platform));
  let changed = false;
  platforms.forEach(p => {
    if (!knownPlatforms.has(p)) changed = true;
  });
  if (!changed) return;
  knownPlatforms = new Set([...knownPlatforms, ...platforms]);

  const current = platformFilter.value;
  platformFilter.innerHTML = '<option value="">All platforms</option>';
  [...knownPlatforms].sort().forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    platformFilter.appendChild(opt);
  });
  platformFilter.value = current;
}

function renderJobs(jobs) {
  jobsBody.innerHTML = "";
  emptyMsg.style.display = jobs.length === 0 ? "block" : "none";

  jobs.forEach(job => {
    const tr = document.createElement("tr");
    if (job.status === "failed") tr.classList.add("row-failed");

    const errorText = job.error_message || "";
    const truncated = errorText.length > 60 ? errorText.slice(0, 60) + "…" : errorText || "—";

    tr.innerHTML = `
      <td>${job.id}</td>
      <td>${escapeHtml(job.platform)}</td>
      <td><span class="badge ${job.status}">${job.status}</span></td>
      <td>${job.attempts}</td>
      <td>${fmtDate(job.scheduled_at)}</td>
      <td class="error-cell" title="${escapeHtml(errorText)}">${escapeHtml(truncated)}</td>
      <td></td>
    `;

    if (job.status === "failed") {
      const btn = document.createElement("button");
      btn.className = "btn btn-green";
      btn.textContent = "Retry";
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = "Retrying…";
        try {
          await fetchJson(`/api/jobs/${job.id}/retry`, { method: "POST" });
          await refresh();
        } catch (e) {
          alert(`Retry failed: ${e.message}`);
          btn.disabled = false;
          btn.textContent = "Retry";
        }
      };
      tr.lastElementChild.appendChild(btn);
    }

    jobsBody.appendChild(tr);
  });
}

async function refresh() {
  try {
    const [stats, jobs] = await Promise.all([
      fetchJson("/api/stats"),
      fetchJson(
        "/api/jobs?" +
          new URLSearchParams({
            ...(statusFilter.value ? { status: statusFilter.value } : {}),
            ...(platformFilter.value ? { platform: platformFilter.value } : {}),
            limit: 50,
          })
      ),
    ]);
    renderStats(stats);
    renderPlatformOptions(jobs);
    renderJobs(jobs);
    lastUpdated.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    lastUpdated.textContent = `Update failed: ${e.message}`;
  }
}

statusFilter.addEventListener("change", refresh);
platformFilter.addEventListener("change", refresh);

refresh();
setInterval(refresh, REFRESH_MS);

// --- Tabs ---------------------------------------------------------------

const tabButtons = document.querySelectorAll(".tab-btn");
const tabPanels = {
  monitor: document.getElementById("tab-monitor"),
  newjob: document.getElementById("tab-newjob"),
  accounts: document.getElementById("tab-accounts"),
};

function showTab(name) {
  tabButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.tab === name));
  Object.entries(tabPanels).forEach(([key, el]) => el.classList.toggle("active", key === name));
  if (name === "accounts") loadAccountsTab();
  if (name === "newjob") loadAccountOptions(jobPlatformSelect.value);
}

tabButtons.forEach(btn => btn.addEventListener("click", () => showTab(btn.dataset.tab)));

// --- Accounts tab ---------------------------------------------------------

const accountsBody = document.getElementById("accounts-body");
const accountsEmpty = document.getElementById("accounts-empty");

async function loadAccountsTab() {
  accountsBody.innerHTML = "";
  try {
    const accounts = await fetchJson("/api/accounts");
    accountsEmpty.style.display = accounts.length === 0 ? "block" : "none";
    accounts.forEach(a => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${a.id}</td>
        <td><span class="badge platform">${escapeHtml(a.platform)}</span></td>
        <td>${escapeHtml(a.name)}</td>
        <td><span class="badge ${a.is_active ? "active" : "inactive"}">${a.is_active ? "Active" : "Inactive"}</span></td>
        <td>${fmtDate(a.created_at)}</td>
      `;
      accountsBody.appendChild(tr);
    });
  } catch (e) {
    accountsEmpty.style.display = "none";
    accountsBody.innerHTML = `<tr><td colspan="5">Failed to load accounts: ${escapeHtml(e.message)}</td></tr>`;
  }
}

// --- New job tab ----------------------------------------------------------

const jobPlatformSelect = document.getElementById("job-platform");
const jobAccountSelect = document.getElementById("job-account");
const jobFileInput = document.getElementById("job-file");
const jobTitleInput = document.getElementById("job-title");
const jobForm = document.getElementById("new-job-form");
const jobResult = document.getElementById("job-result");
const jobSubmitBtn = document.getElementById("job-submit");

function resultBox(ok, msg) {
  return `<div class="result-box ${ok ? "ok" : "err"}">${escapeHtml(msg)}</div>`;
}

async function loadAccountOptions(platform) {
  if (!platform) {
    jobAccountSelect.innerHTML = '<option value="">Select a platform first…</option>';
    jobAccountSelect.disabled = true;
    return;
  }
  jobAccountSelect.disabled = false;
  jobAccountSelect.innerHTML = '<option value="">Loading…</option>';
  try {
    const accounts = await fetchJson("/api/accounts?" + new URLSearchParams({ platform }));
    jobAccountSelect.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = platform === "tiktok" ? "Select an account…" : "No account (single-account fallback)";
    jobAccountSelect.appendChild(placeholder);
    accounts.filter(a => a.is_active).forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.id;
      opt.textContent = a.name;
      jobAccountSelect.appendChild(opt);
    });
  } catch (e) {
    jobAccountSelect.innerHTML = `<option value="">Failed to load accounts</option>`;
  }
}

jobPlatformSelect.addEventListener("change", () => loadAccountOptions(jobPlatformSelect.value));

jobForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  jobResult.innerHTML = "";

  const platform = jobPlatformSelect.value;
  const file = jobFileInput.files[0];

  if (!platform) {
    jobResult.innerHTML = resultBox(false, "Select a platform.");
    return;
  }
  if (!file) {
    jobResult.innerHTML = resultBox(false, "Choose a video file.");
    return;
  }
  if (platform === "tiktok" && !jobAccountSelect.value) {
    jobResult.innerHTML = resultBox(false, "TikTok jobs require an account.");
    return;
  }

  const formData = new FormData();
  formData.append("platform", platform);
  formData.append("file", file);
  if (jobAccountSelect.value) formData.append("account_id", jobAccountSelect.value);
  if (jobTitleInput.value.trim()) formData.append("title", jobTitleInput.value.trim());

  jobSubmitBtn.disabled = true;
  jobSubmitBtn.textContent = "Creating…";
  try {
    const created = await fetchJson("/api/jobs", { method: "POST", body: formData });
    jobResult.innerHTML = resultBox(true, `Job #${created.id} created and dispatched.`);
    jobForm.reset();
    loadAccountOptions("");
    showTab("monitor");
    refresh();
  } catch (err) {
    jobResult.innerHTML = resultBox(false, `Failed: ${err.message}`);
  } finally {
    jobSubmitBtn.disabled = false;
    jobSubmitBtn.textContent = "Create job";
  }
});
</script>

</body>
</html>
