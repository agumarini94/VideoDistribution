# Fly.io deploy config — READY BUT UNUSED. The Fly.io account belongs to
# the client; nothing here has been deployed. Replace the placeholder app
# name once that account exists, then follow the checklist in README.md /
# CLAUDE.md (Phase 9) to deploy.
#
# No secrets go in this file. REDIS_URL, DATABASE_URL, ALERT_WEBHOOK_URL,
# X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET,
# R2_* etc. must all be set with `fly secrets set NAME=value` against the
# real app once it exists.

app = "distribution-engine"
primary_region = "gru"

[build]

# Single-machine mode, deliberate: the NEW JOB upload flow
# (dashboard/api.py::create_job) writes files to local disk under uploads/,
# so whichever process later reads that path (the worker) must share a
# filesystem with whichever process wrote it (the api process) — meaning
# they must run on the same machine, not as separate Fly processes/machines.
# scripts/start_all.sh starts the worker and beat in the background and
# execs uvicorn in the foreground. Split this back into separate
# worker/beat/api [processes] entries once R2 storage (see CLAUDE.md
# Phase 3) is wired into the upload flow and uploads no longer live on
# local disk.
[processes]
app = "scripts/start_all.sh"

[[services]]
processes = ["app"]
internal_port = 8000
protocol = "tcp"

  [[services.ports]]
  handlers = ["http"]
  port = 80

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

  [[services.http_checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
