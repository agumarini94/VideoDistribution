# fly.toml app configuration file generated for distribution-engine on 2026-09-15T13:03:29+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'distribution-engine'
primary_region = 'gru'

[build]
[processes]
  app = 'scripts/start_all.sh'

# Patch fix (no R2 yet): uploads/ is local disk (see CLAUDE.md Phase 9), so
# with more than one machine, whichever one didn't receive the upload gets
# "Video file not found" when the worker tries to publish it. A Fly volume
# is mounted per-machine, not shared across machines, so this only works
# with exactly ONE machine (see "fly scale count 1" in the deploy notes) —
# this is a stopgap, not the real fix. The real fix is wiring every local-
# disk-reading publisher (youtube/tiktok/twitter/facebook) onto R2's
# media_public_url the way instagram.py/threads.py already do; see
# CLAUDE.md Phase 22/25 and the migration note left for the client.
[[mounts]]
  source = 'uploads_data'
  destination = '/app/uploads'

[http_service]
  internal_port = 8000
  force_https = true
  # 'off' instead of 'stop': this single machine also runs Celery worker +
  # beat in the background (scripts/start_all.sh) — the scheduler
  # (dispatch_due_jobs / refresh_expiring_tokens / detect_stalled_jobs)
  # must never be suspended just because HTTP traffic is quiet.
  auto_stop_machines = 'off'
  auto_start_machines = true
  # Must stay >= 1 for the same reason: a volume-mounted machine that's
  # scaled to 0 takes the scheduler down with it.
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
